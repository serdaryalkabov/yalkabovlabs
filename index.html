
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Image</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;

            object-fit: cover;
        }

</head>
<body>

    <img src="Labs2.jpg" alt="Image">
